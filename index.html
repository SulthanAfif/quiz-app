<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Quiz App</h1>
            <button id="darkModeToggle" class="dark-mode-btn">🌙</button>
        </header>

        <!-- ========== START SCREEN ========== -->
        <div id="startScreen" class="screen">
            <div class="start-content">
                <h2>Frontend Quiz</h2>
                <p class="subtitle">Uji pengetahuanmu sekarang!</p>

                <div class="setup-box">
                    <label>Kategori</label>
                    <select id="categorySelect">
                        <option value="mixed">Campuran</option>
                        <option value="html">HTML</option>
                        <option value="css">CSS</option>
                        <option value="javascript">JavaScript</option>
                    </select>

                    <label>Tingkat Kesulitan</label>
                    <select id="difficultySelect">
                        <option value="easy">Mudah (20 detik)</option>
                        <option value="medium" selected>Sedang (15 detik)</option>
                        <option value="hard">Sulit (10 detik)</option>
                    </select>
                </div>

                <p class="high-score">High Score: <strong id="highScoreDisplay">0</strong></p>
                <button id="startBtn" class="btn primary">Mulai Kuis</button>
            </div>
        </div>

        <!-- ========== QUIZ SCREEN ========== -->
        <div id="quizScreen" class="screen hidden">
            <div class="quiz-header">
                <div class="top-bar">
                    <span id="questionNumber">1/10</span>
                    <div class="lives" id="livesDisplay">❤️❤️❤️</div>
                    <span id="timer">15</span>
                </div>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <div class="score-live">Skor: <span id="scoreDisplay">0</span></div>
            </div>

            <div class="question-box">
                <h2 id="questionText">Pertanyaan muncul di sini</h2>
            </div>

            <div id="optionsContainer" class="options"></div>

            <div class="quiz-footer">
                <button id="skipBtn" class="btn secondary">Lewati</button>
                <button id="nextBtn" class="btn primary hidden">Selanjutnya →</button>
            </div>
        </div>

        <!-- ========== RESULT SCREEN ========== -->
        <div id="resultScreen" class="screen hidden">
            <div class="result-content">
                <h2 id="resultTitle">Hasil Kuis</h2>
                <div class="score-circle">
                    <span id="finalScore">0</span>
                    <small id="totalQuestions">/10</small>
                </div>
                <p id="percentage">0%</p>
                <p id="resultMessage">Kerja bagus!</p>
                <p class="new-high hidden" id="newHighScore">🎉 High Score Baru!</p>

                <div class="result-actions">
                    <button id="reviewBtn" class="btn secondary">Lihat Jawaban</button>
                    <button id="restartBtn" class="btn primary">Main Lagi</button>
                </div>
            </div>
        </div>

        <!-- ========== REVIEW SCREEN ========== -->
        <div id="reviewScreen" class="screen hidden">
            <h2 class="review-title">Review Jawaban</h2>
            <div id="reviewList" class="review-list"></div>
            <button id="backToResultBtn" class="btn primary">Kembali</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
